<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>WordRush</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1C1A17" />
    <meta
      name="description"
      content="A multiplayer word race for up to 8 players, in Spanish and English. Every new letter adds seconds, every rival solve takes them away. Whoever ends with the most clock wins."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordRush" />
    <meta property="og:title" content="WordRush · Multiplayer word race" />
    <meta
      property="og:description"
      content="Guess first. Every second counts. Rooms of up to 8 players, in Spanish and English."
    />
    <meta property="og:url" content="https://wordrush.up.railway.app/" />
    <meta property="og:image" content="https://wordrush.up.railway.app/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WordRush: Guess first. Every second counts." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordRush · Multiplayer word race" />
    <meta
      name="twitter:description"
      content="Guess first. Every second counts. Rooms of up to 8 players, in Spanish and English."
    />
    <meta name="twitter:image" content="https://wordrush.up.railway.app/og-en.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <script>
      // Apply the stored theme before React mounts to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('wordrush.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
